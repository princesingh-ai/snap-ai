# Workbench llama.cpp model preset template
#
# This file is a template for configuring llama.cpp model loading.
#
# IMPORTANT:
# - Replace the example model sections with the actual model aliases
#   available in your models directory.
# - Set main-gpu according to the GPU layout of the deployment.
# - Do not copy GPU assignments from another machine without checking
#   its GPU availability and ownership.
#
# The model aliases in this file must match the aliases/names used by
# the llama.cpp router.
#
# Example model section:
#
# [your-model-alias]
# main-gpu = 0
# load-on-startup = true
#
# Global defaults:

version = 1

[*]
n-gpu-layers = 999
split-mode = none

# Add deployment-specific model sections below.
#
# Example:
#
# [your-coding-model]
# main-gpu = 0
# load-on-startup = true
#
# [your-reasoning-model]
# main-gpu = 1
# load-on-startup = true
#
# [your-general-model]
# main-gpu = 1
# load-on-startup = true
